name: Hyphen
description: >-
  Hyphen was a mobile-first employee engagement and pulse-survey platform that let organizations
  collect anonymous employee feedback, run continuous sentiment surveys, and give managers analytics
  on engagement and culture. Founded as a 500 Global-backed startup, Hyphen was acquired by Betterworks
  and folded into the Betterworks Engage product line. Its original domain, gethyphen.com, now
  301-redirects to betterworks.com/product/engage-overview/, and the company no longer operates an
  independent public developer or API surface. This profile is retained as an acquired-company lead in
  the API Evangelist network; the live successor product is Betterworks Engage.
